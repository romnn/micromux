# yaml-language-server: $schema=https://github.com/romnn/micromux/raw/main/micromux.schema.json
#
# Reproducible demo stack used to generate the README screenshots (see crates/micromux-screenshot).
#
# Every service is deterministic and self-contained: each script in bin/ prints a fixed, colorized
# banner and then sleeps (or exits), and every healthcheck resolves on its first probe with a long
# interval, so the UI settles into a stable frame within a second. The set is arranged so one
# capture shows every lifecycle state at once: healthy, running, a completed job, unhealthy, blocked
# on a dependency, and an idle manual job. The worker logs structured JSON to show timestamps and
# hidden fields.
version: "1"

# Browser URLs such as http://shop.demo.localhost:8480, served by the shared micromux proxy.
session:
  name: demo
proxy:
  # A port of its own, so the demo never competes with the proxy of your real sessions on port 80.
  port: 8480
routes:
  - host: shop
    port: 3000
  - host: shop
    path: /api/
    port: 8080

services:
  api:
    command: ["./bin/api.sh"]
    ports:
      - 8080
    depends_on:
      - migrate # a bare dependency on a job waits for it to complete
      - name: redis
        condition: healthy
    healthcheck:
      test: ["CMD-SHELL", "echo 'GET /health -> 200 OK in 1ms'"]
      start_delay: "100ms"
      interval: "1h"
      timeout: "2s"

  web:
    command: ["./bin/web.sh"]
    ports:
      - 3000

  worker:
    command: ["./bin/worker.sh"]
    depends_on:
      - name: api
        condition: healthy
    logs:
      # The source location and span context matter to agents reading the logs, not at a glance.
      fields: {filename: hide, line_number: hide, span: hide, spans: hide}

  postgres:
    command: ["./bin/postgres.sh"]
    ports:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "echo 'accepting connections'"]
      start_delay: "100ms"
      interval: "1h"
      timeout: "2s"
    # Runs after every exit of postgres, such as `docker compose down` for a containerized one.
    cleanup:
      command: ["sh", "-c", "echo 'postgres stopped'"]

  redis:
    command: ["./bin/redis.sh"]
    ports:
      - 6379
    healthcheck:
      test: ["CMD-SHELL", "echo 'PONG'"]
      start_delay: "100ms"
      interval: "1h"
      timeout: "2s"

  # Jobs run to completion instead of being kept up.
  migrate:
    kind: job
    command: ["./bin/migrate.sh"]
    depends_on:
      - name: postgres
        condition: healthy

  payments:
    command: ["./bin/payments.sh"]
    ports:
      - 7070
    healthcheck:
      test: ["CMD-SHELL", "echo 'connect: connection refused'; exit 1"]
      start_delay: "100ms"
      interval: "1h"
      timeout: "2s"
      retries: 0

  checkout:
    command: ["./bin/checkout.sh"]
    depends_on:
      - name: payments
        condition: healthy

  # A manual job runs only on request, with `r` in the TUI or `micromux ctl restart seed`.
  seed:
    kind: job
    run: manual
    command: ["./bin/seed.sh"]
    depends_on:
      - migrate
