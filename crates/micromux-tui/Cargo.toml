[package]
name = "micromux-tui"
license-file = "../../LICENSE"
readme = "../../README.md"
documentation = "https://docs.rs/micromux-tui"
publish = true

version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
categories = [
  "command-line-utilities",
]
keywords = [
  "terminal",
  "multiplexer",
  "tui",
]

[lints]
workspace = true

[dependencies]
itertools.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
thiserror.workspace = true

# tracing
tracing.workspace = true

# micromux
micromux = { path = "../micromux/" }
micromux-control = { path = "../micromux-control/" }

# serde
serde_json.workspace = true

# log timestamps in local time
chrono = { workspace = true, features = ["clock"] }

# tui
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }
ansi-to-tui = "8"
strip-ansi-escapes.workspace = true
# Search matches end on whole graphemes, which ratatui draws as one cell run.
unicode-segmentation = "1"
# osc52 copies a mouse selection to the clipboard, which also works over ssh.
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }

# async runtime
tokio.workspace = true
futures.workspace = true

[target.'cfg(unix)'.dependencies]
# Ctrl-Z raises the stop signal itself, since raw mode delivers it as a key, and the tmux pane
# micromux runs in is told by its terminal's name.
nix = { workspace = true, features = ["signal", "term"] }

[dev-dependencies]
color-eyre.workspace = true
codespan-reporting.workspace = true
indoc.workspace = true
similar-asserts.workspace = true
tempfile.workspace = true
