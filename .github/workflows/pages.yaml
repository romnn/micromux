name: pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mise.toml"
      - "taskfile.yaml"
      - ".github/workflows/pages.yaml"
  workflow_dispatch: {}

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The terminal snippets (docs/assets/terminals) and screenshots
      # (docs/static/images) are committed and regenerated by hand
      # (`task docs:terminals`, `task screenshots`), so the site builds from
      # go + extended Hugo alone — no Rust toolchain, no micromux binary.
      - uses: jdx/mise-action@v4
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          install: false
          cache: true
      - name: Install docs toolchain
        run: >-
          mise install
          go "asdf:NeoHsu/asdf-hugo" task
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build docs
        run: mise exec -- task docs:build -- --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
